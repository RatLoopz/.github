name: "Auto-invite on invitation issue"

on:
  issues:
    types: [opened]

jobs:
  invite:
    # Only run when the issue has the 'welcome' label
    # AND the title matches our invitation title
    if: >
      contains(github.event.issue.labels.*.name, 'welcome') &&
      github.event.issue.title == 'Please invite me to RatLoopz'
    runs-on: ubuntu-latest

    steps:
      - name: Invite user to organization
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_INVITE_TOKEN_NEW }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Try to extract GitHub username from the issue form output
            // Issue forms render roughly as:
            // ### GitHub username
            // someusername
            function extractUsernameFromBody(text) {
              const match = text.match(/###\s*GitHub username\s*\n+([A-Za-z0-9-]+)/i);
              if (match && match[1]) {
                return match[1].trim();
              }
              return null;
            }

            let username = extractUsernameFromBody(body);

            // Fallback: issue author
            if (!username && issue.user && issue.user.login) {
              username = issue.user.login;
            }

            if (!username) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "⚠️ Could not determine your GitHub username from the form. Please reply with your GitHub handle."
              });
              core.setFailed("Username not found in issue body or author.");
              return;
            }

            try {
              // Look up the user by username
              const { data: user } = await github.rest.users.getByUsername({ username });

              // Create organization invitation
              const invite = await github.rest.orgs.createInvitation({
                org: context.repo.owner,       // 'ratloopz'
                invitee_id: user.id,           // invite by user ID
                role: 'direct_member'          // or 'admin' / 'billing_manager' if you really want
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Invitation sent to @${username}. They should receive an email/notification soon.`
              });

            } catch (error) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ Failed to invite \`@${username}\`. Error: \`${error.message}\``
              });
              core.setFailed(error.message);
            }
